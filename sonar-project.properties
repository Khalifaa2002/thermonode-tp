sonar.projectKey=thermonode
sonar.projectName=ThermoNode
sonar.sources=firmware/src,gateway/gateway
sonar.tests=firmware/test,gateway/tests
sonar.test.exclusions=firmware/test/unity/**
sonar.sourceEncoding=UTF-8

# --- Python : analyseur natif SonarQube + rapports pytest ---
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage-gw.xml
sonar.python.xunit.reportPath=reports/junit-gw.xml

# --- C : deux options selon l'édition de SonarQube ---
# Option A (Community, sans plugin) : import des constats cppcheck au format "generic issue"
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.externalIssuesReportPaths=reports/cppcheck-sonar.json
# Option B (Community + plugin communautaire sonar-cxx) : décommenter et commenter les 3 lignes ci-dessus
#sonar.cxx.file.suffixes=.c,.h
#sonar.cxx.cppcheck.reportPaths=reports/cppcheck.xml
#sonar.cxx.cobertura.reportPaths=reports/coverage-fw.xml
#sonar.cxx.xunit.reportPaths=reports/junit-fw.xml
# Option C (édition Developer ou supérieure) : analyseur C/C++ natif — retirer les lignes "suffixes=-"
